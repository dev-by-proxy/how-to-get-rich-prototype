<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>How to Get Rich Prototype</title>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: the app's own phone column (430px) with a bottom tab bar; cards stacked by importance. Tokens copied from app/src/styles/tokens.css. */
:root {
  --paper: oklch(98.3% 0.009 250); --paper-2: oklch(99.7% 0.002 250); --paper-3: #DCEEFF;
  --ink: oklch(13% 0.012 252); --ink-2: oklch(30% 0.02 250); --muted: oklch(45% 0.03 250);
  --rule: oklch(87% 0.02 250); --outline: oklch(13% 0.012 252);
  --accent: #4DA2FF; --accent-ink: oklch(13% 0.012 252); --focus: oklch(46% 0.19 258);
  --gold: #FFD731; --gold-ink: oklch(13% 0.012 252); --mint: #55DB9C;
  --positive: oklch(44% 0.12 155); --positive-wash: color-mix(in oklab, #55DB9C 30%, oklch(99.7% 0.002 250));
  --accent-wash: color-mix(in oklab, #4DA2FF 22%, oklch(99.7% 0.002 250));
  --error: oklch(50% 0.19 27); --error-wash: oklch(95% 0.03 27);
  --toast: #55DB9C; --toast-ink: oklch(13% 0.012 252);
  --scrim: oklch(13% 0.012 252 / 0.45);
  --font-display: "Arial Black", "Arial Bold", Arial, Helvetica, sans-serif;
  --font-body: Arial, Helvetica, sans-serif;
  --r-card: 24px; --r-control: 16px; --r-pill: 999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: oklch(17% 0.025 252); --paper-2: oklch(22% 0.03 252); --paper-3: oklch(29% 0.05 252);
  --ink: oklch(96% 0.008 250); --ink-2: oklch(86% 0.015 250); --muted: oklch(76% 0.025 250);
  --rule: oklch(33% 0.035 252); --outline: oklch(56% 0.045 252);
  --accent: oklch(74% 0.13 252); --accent-ink: oklch(17% 0.025 252); --focus: oklch(84% 0.1 252);
  --gold: oklch(87% 0.15 95); --gold-ink: oklch(17% 0.025 252); --mint: oklch(80% 0.13 155);
  --positive: oklch(80% 0.13 155); --positive-wash: oklch(30% 0.05 160); --accent-wash: oklch(38% 0.09 252);
  --error: oklch(76% 0.14 25); --error-wash: oklch(28% 0.06 25);
  --toast: oklch(30% 0.05 160); --toast-ink: oklch(96% 0.008 250); --scrim: oklch(5% 0.01 252 / 0.6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: oklch(17% 0.025 252); --paper-2: oklch(22% 0.03 252); --paper-3: oklch(29% 0.05 252);
  --ink: oklch(96% 0.008 250); --ink-2: oklch(86% 0.015 250); --muted: oklch(76% 0.025 250);
  --rule: oklch(33% 0.035 252); --outline: oklch(56% 0.045 252);
  --accent: oklch(74% 0.13 252); --accent-ink: oklch(17% 0.025 252); --focus: oklch(84% 0.1 252);
  --gold: oklch(87% 0.15 95); --gold-ink: oklch(17% 0.025 252); --mint: oklch(80% 0.13 155);
  --positive: oklch(80% 0.13 155); --positive-wash: oklch(30% 0.05 160); --accent-wash: oklch(38% 0.09 252);
  --error: oklch(76% 0.14 25); --error-wash: oklch(28% 0.06 25);
  --toast: oklch(30% 0.05 160); --toast-ink: oklch(96% 0.008 250); --scrim: oklch(5% 0.01 252 / 0.6);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
main { max-width: 430px; margin: 0 auto; padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--s4); }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: -0.01em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 0.875rem; }
.small { font-size: 0.75rem; }
.neg { color: var(--error); }
.pos { color: var(--positive); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 56px; padding-top: var(--s2); }
.logo { width: 170px; height: auto; display: block; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display: none; } :root:not([data-theme="light"]) .logo-dark { display: block; } }
:root[data-theme="dark"] .logo-light { display: none; } :root[data-theme="dark"] .logo-dark { display: block; }
.demo-chip { min-height: 32px; padding: 0 var(--s3); border-radius: var(--r-pill); border: 1px solid var(--outline); background: var(--gold); color: var(--gold-ink); font: 700 0.75rem var(--font-body); cursor: pointer; }

.card { background: var(--paper-2); border: 2px solid var(--outline); border-radius: var(--r-card); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
.card.flat { border-width: 1px; border-color: var(--rule); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }

/* Lead card */
.lead { background: var(--accent-wash); }
.lead .label { font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.lead .amount { font-family: var(--font-display); font-size: 3.2rem; line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.lead .perday { font-size: 1.05rem; }
.lead .lines { display: flex; flex-direction: column; gap: var(--s1); padding-top: var(--s2); border-top: 1px solid var(--rule); }
.line { display: flex; justify-content: space-between; gap: var(--s3); }
.line > span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.info { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--outline); background: var(--paper-2); color: var(--ink); font: 700 1rem var(--font-body); cursor: pointer; position: relative; }
.info::before { content: ""; position: absolute; inset: -4px; }
.workings { display: flex; flex-direction: column; gap: var(--s1); background: var(--paper-2); border-radius: var(--r-control); padding: var(--s3); font-size: 0.9rem; }
.workings .total { border-top: 1px solid var(--rule); padding-top: var(--s1); font-weight: 700; }
.over-box { background: var(--error-wash); border-radius: var(--r-control); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s1); }

/* Checklist */
.check { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s2) 0; border-top: 1px solid var(--rule); cursor: pointer; }
.check:first-of-type { border-top: 0; }
.box { flex: 0 0 26px; height: 26px; border-radius: 8px; border: 2px solid var(--outline); display: grid; place-items: center; font-weight: 900; background: var(--paper-2); }
.check.done .box { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.check.done .text { color: var(--muted); text-decoration: line-through; }
.check .sub { font-size: 0.8rem; color: var(--muted); }

/* Limits */
.limit { display: flex; flex-direction: column; gap: var(--s1); padding-block: var(--s2); border-top: 1px solid var(--rule); }
.limit:first-of-type { border-top: 0; }
.meter { height: 10px; border-radius: var(--r-pill); background: var(--paper-3); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: var(--r-pill); }
.meter.warn > i { background: var(--gold); }
.meter.over > i { background: var(--error); }
.count { font-size: 0.85rem; color: var(--ink-2); }

/* Tables of rows */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: var(--s3); padding-block: var(--s2); border-top: 1px solid var(--rule); align-items: baseline; }
.row:first-child { border-top: 0; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.head { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.tag { font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); white-space: nowrap; }
.tag.good { background: var(--positive-wash); color: var(--positive); }
.tag.plain { background: var(--paper-3); color: var(--ink-2); }

/* Buttons (four roles from the app's button system) */
button { font-family: var(--font-body); }
.btn { min-height: 48px; padding: 0 var(--s5); border: 0; border-radius: var(--r-pill); background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; cursor: pointer; }
.btn.secondary { background: transparent; border: 1px solid var(--outline); color: var(--ink); min-height: 44px; }
.btn.inline { min-height: 32px; padding: 0 var(--s3); font-size: 0.875rem; }
.btn.link { background: none; color: var(--ink-2); text-decoration: underline; padding: 0 var(--s1); min-height: 44px; font-weight: 400; }
.btn:focus-visible, .info:focus-visible, .demo-chip:focus-visible, .chip:focus-visible, .tab:focus-visible, .check:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* Month header */
.monthbar { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
.monthbar h1 { font-family: var(--font-display); font-size: 1.44rem; }

/* Prompt (month-end) */
.prompt { background: var(--positive-wash); border-color: var(--positive); }
.prompt h2 { font-size: 1.1rem; }
.explain { font-size: 0.78rem; color: var(--muted); margin-top: -2px; }
.lead .lines .item { display: flex; flex-direction: column; }
.over-box .big { font-weight: 700; font-size: 1.05rem; }
.over-box .step { display: flex; gap: var(--s2); align-items: baseline; }
.over-box .step b { flex: 0 0 auto; }
.howto { align-self: flex-start; }
.nowrap { white-space: nowrap; }
.over-box .btn-row { margin-top: var(--s1); }

/* Folded cards (tap to open) */
details.card { gap: 0; }
details.card > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: var(--s2); min-height: 44px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary h2 { font-size: 1rem; }
details.card > summary .sum-r { display: flex; align-items: center; gap: var(--s2); white-space: nowrap; }
details.card > summary .chev { transition: transform 0.15s; }
details.card[open] > summary .chev { transform: rotate(90deg); }
details.card[open] > summary { margin-bottom: var(--s3); }
details.card > .body { display: flex; flex-direction: column; gap: var(--s3); }
details.card > summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

/* Log */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s1); background: var(--paper-3); border-radius: var(--r-pill); padding: var(--s1); }
.seg button { min-height: 40px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--ink); font-weight: 700; font-size: 0.8rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--paper-2); box-shadow: 0 0 0 1px var(--outline); }
.amount-input { display: flex; align-items: baseline; justify-content: center; gap: var(--s1); font-family: var(--font-display); font-size: 3rem; }
.amount-input input { width: 6.5ch; font: inherit; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 0; min-width: 0; }
.amount-input input:focus-visible { outline: 2px solid var(--focus); border-radius: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { min-height: 44px; padding: 0 var(--s4); border-radius: var(--r-pill); border: 1px solid var(--outline); background: var(--paper-2); color: var(--ink); font-weight: 700; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper-2); }
label { display: flex; flex-direction: column; gap: var(--s1); font-weight: 700; font-size: 0.875rem; }
input[type="text"], input[type="number"], select { min-height: 48px; padding: 0 var(--s4); border: 2px solid var(--outline); border-radius: var(--r-control); background: var(--paper); color: var(--ink); font-size: 1rem; font-family: var(--font-body); width: 100%; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper-2); border-top: 1px solid var(--rule);
  padding: var(--s2) max(16px, env(safe-area-inset-right, 0px)) calc(var(--s2) + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.tabbar nav { max-width: 430px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s1); }
.tab { min-height: 48px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--ink); font-weight: 700; font-size: 0.85rem; cursor: pointer; }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

/* Sheets and toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: flex; align-items: flex-end; justify-content: center; padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 430px; background: var(--paper-2); border-radius: var(--r-card) var(--r-card) 0 0; border: 2px solid var(--outline); border-bottom: 0; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); max-height: 85vh; overflow-y: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(398px, calc(100% - 32px)); background: var(--toast); color: var(--toast-ink); border-radius: var(--r-control); padding: var(--s3) var(--s4); font-weight: 700; z-index: 40; display: flex; justify-content: space-between; gap: var(--s3); align-items: center; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; cursor: pointer; min-height: 44px; min-width: 44px; }

/* Setup */
.prompt-item { border-top: 1px solid var(--rule); padding-block: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.prompt-item:first-child { border-top: 0; }
.prompt-item > button { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); text-align: left; background: none; border: 0; color: var(--ink); font: 700 1rem var(--font-body); cursor: pointer; min-height: 44px; padding: 0; }
.prompt-item .ex { font-weight: 400; font-size: 0.85rem; color: var(--muted); display: block; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } .lead .amount { font-size: 2.6rem; } }
@media (prefers-reduced-motion: no-preference) { .glow { animation: glow 1.6s var(--ease, ease-out) 1; } @keyframes glow { 0% { box-shadow: 0 0 0 0 var(--mint); } 30% { box-shadow: 0 0 0 6px var(--mint); } 100% { box-shadow: 0 0 0 0 transparent; } } }
</style>
</head>
<body>

<main id="app" aria-live="off"></main>
<div class="tabbar" id="tabbar"><nav aria-label="Screens">
  <button class="tab" data-tab="month">Month</button>
  <button class="tab" data-tab="log">Log</button>
  <button class="tab" data-tab="budget">Budget</button>
  <button class="tab" data-tab="history">History</button>
</nav></div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-close" aria-label="Close message">✕</button></div>

<script>
/* ── Made-up person: "Mei". Not anyone's real data. ───────────────────────── */
const PLAN = {
  income: [{ name: "Salary (take-home)", amt: 3200 }],
  bills: [{ name: "Phone plan", amt: 30 }, { name: "Health insurance", amt: 85 }, { name: "Town council (S&CC)", amt: 62 }, { name: "Home internet", amt: 45 }],
  savings: [{ name: "Monthly savings plan", amt: 300 }],
  saveups: [
    { name: "Life insurance", amt: 95, yearly: 1140, due: 3 },
    { name: "Property tax", amt: 40, yearly: 480, due: 6 },
    { name: "Income tax", amt: 60, yearly: 720, due: 4 },
    { name: "CNY ang bao", amt: 50, yearly: 600, due: 2 },
  ],
  limits: { "Food": 800, "Transport": 200, "Groceries": 300, "Misc": 350 },
  noLimit: ["Household"],
  countLimit: { cat: "Food", over: 40, perWeek: 2, label: "Nice meals over $40" },
  oneOffAt: 250,
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const sum = a => a.reduce((x, y) => x + y, 0);
const fmt = n => (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = n => (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-SG");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Deterministic made-up spending, so every tester sees the same numbers. */
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function genMonth(year, month, uptoDay, seed, extra = []) {
  const r = rng(seed), out = [];
  const add = (day, cat, amt, note, kind = "expense") => out.push({ id: `${month}-${out.length}`, day, cat, amt: Math.round(amt * 100) / 100, note, kind });
  for (let d = 1; d <= uptoDay; d++) {
    const wd = new Date(year, month - 1, d).getDay(), weekday = wd >= 1 && wd <= 5;
    if (weekday && r() < 0.85) add(d, "Food", 1.6, "Kopi");
    if (weekday) add(d, "Food", 6 + r() * 3.8, "Lunch");
    if (r() < 0.11) add(d, "Food", 46 + r() * 22, "Dinner with friends");
    else if (r() < 0.85) add(d, "Food", 6.5 + r() * 6, "Dinner");
    if (r() < 0.2) add(d, "Food", 4.8, "Bubble tea");
    if (weekday) add(d, "Transport", 3.6 + r() * 1.4, "MRT");
    if (r() < 0.13) add(d, "Transport", 14 + r() * 9, "Grab");
    if (wd === 6) add(d, "Groceries", 45 + r() * 25, "NTUC");
    if (r() < 0.12) add(d, "Misc", 8 + r() * 30, ["Shopee", "Haircut", "Movie", "Gift for Jess", "Pharmacy"][Math.floor(r() * 5)]);
    if (r() < 0.05) add(d, "Household", 6 + r() * 10, "Detergent");
    if (d === 3) add(d, "Misc", 10.98, "Spotify");
  }
  extra.forEach(e => add(e.day, e.cat, e.amt, e.note, e.kind || "expense"));
  out.forEach(e => { if (e.kind === "expense" && e.amt >= PLAN.oneOffAt) e.oneOff = true; });
  return out;
}

/* What happened before this month (for "this year" figures). */
const HISTORY = {
  oneOffs: [
    { month: 1, note: "Phone screen repair", amt: 320, group: "Phone and laptop" },
    { month: 2, note: "New laptop", amt: 1150, group: "Phone and laptop" },
    { month: 3, note: "Flight to Bangkok", amt: 420, group: "Travel" },
    { month: 4, note: "Dentist: root canal", amt: 1780, group: "Health" },
  ],
  movedToSavings: [{ month: 2, amt: 200 }],
  usual: { "Kopi": { n: 30, amt: 48 }, "Bubble tea": { n: 9, amt: 43.2 }, "Grab": { n: 4, amt: 72 } }, // a usual full month (Jan–Feb)
};
const GROUPS = { "Flight to Bangkok": "Travel", "Dentist: root canal": "Health", "New laptop": "Phone and laptop", "Phone screen repair": "Phone and laptop" };

/* The four test scenarios (facilitator picks one with #mid-march, #end-april, #end-may, #setup). */
const SCENARIOS = {
  "mid-march": { label: "15 March: a normal month", year: 2026, month: 3, day: 15, seed: 11,
    extra: [{ day: 8, cat: "Misc", amt: 420, note: "Flight to Bangkok" }],
    checklist: { salary: true, bills: true, savings: false, due: false },
    pots: { "Life insurance": 1140, "Property tax": 400, "Income tax": 660, "CNY ang bao": 50 } },
  "end-april": { label: "30 April: a month that ran out", year: 2026, month: 4, day: 30, seed: 29,
    extra: [{ day: 12, cat: "Misc", amt: 1780, note: "Dentist: root canal" }],
    checklist: { salary: true, bills: true, savings: true, due: true },
    pots: { "Life insurance": 95, "Property tax": 440, "Income tax": 0, "CNY ang bao": 100 } },
  "end-may": { label: "28 May: money left near month end", year: 2026, month: 5, day: 28, seed: 7,
    extra: [], checklist: { salary: true, bills: true, savings: true, due: true },
    pots: { "Life insurance": 190, "Property tax": 480, "Income tax": 60, "CNY ang bao": 150 } },
};

let S = null, state = null, tab = "month", openWorkings = false, promptDone = false, lastSaved = null;
function load(key) {
  S = SCENARIOS[key];
  state = { key, entries: genMonth(S.year, S.month, S.day, S.seed, S.extra), checklist: { ...S.checklist }, saved: 0, pots: { ...S.pots } };
  openWorkings = false; promptDone = false; lastSaved = null; if (typeof openFolds !== "undefined") openFolds.clear();
}

/* ── The rules (same as the agreed design) ─────────────────────────────── */
function calc() {
  const dim = new Date(S.year, S.month, 0).getDate();
  const daily = state.entries.filter(e => e.kind === "expense");
  const spent = sum(daily.map(e => e.amt));

  const planMoved = state.checklist.savings ? savings : 0, planToMove = savings - planMoved;

}

  const c = PLAN.countLimit, today = new Date(S.year, S.month - 1, S.day);
  const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  return state.entries.filter(e => e.cat === c.cat && e.kind === "expense" && e.amt > c.over && e.amt < PLAN.oneOffAt && new Date(S.year, S.month - 1, e.day) >= monday).length;
}
function oneOffsThisYear() {
  const items = HISTORY.oneOffs.filter(o => o.month < S.month).concat(
    state.entries.filter(e => e.oneOff).map(e => ({ month: S.month, note: e.note, amt: e.amt, group: GROUPS[e.note] || "Other" })));
  const groups = {};
  items.forEach(i => { (groups[i.group] = groups[i.group] || { amt: 0, n: 0, items: [] }); groups[i.group].amt += i.amt; groups[i.group].n++; groups[i.group].items.push(i); });
  return { total: sum(items.map(i => i.amt)), groups };
}
function repeatBuys() {
  const dim = new Date(S.year, S.month, 0).getDate(), share = S.day / dim;
  return Object.entries(HISTORY.usual).map(([name, u]) => {
    const es = state.entries.filter(e => e.note === name);
    const n = es.length, amt = sum(es.map(e => e.amt));
    const un = u.n * share, ua = u.amt * share;
    const trend = n < un * 0.8 ? "down" : n > un * 1.2 ? "up" : "same";
    return { name, n, amt, un, ua, trend };
  });
}

function dateLabel() { const d = new Date(S.year, S.month - 1, S.day); return d.toLocaleDateString("en-SG", { weekday: "short", day: "numeric", month: "short" }); }

let openFolds = new Set();
const fold = (key, label, right, body) => `<details class="card" data-fold="${key}"${openFolds.has(key) ? " open" : ""}><summary><h2>${label}</h2><span class="sum-r">${right}<span class="chev" aria-hidden="true">›</span></span></summary><div class="body">${body}</div></details>`;

function renderMonth() {
  // Month-end prompt shows from 3 days before the last day (agreed rule), e.g. 28–31 May.
  const c = calc(), monthEnd = S.day >= c.dim - 3;
  const savedThisMonth = c.planMoved + c.moved;
  let html = header() + `<div class="monthbar"><h1>${MONTHS[S.month - 1]}</h1><span class="muted">Today: ${dateLabel()}</span></div>`;

  // Month-end prompt (only when money is left)
  // Round 2: saving everything left "$0 a day" for the last days, which alarmed people. Keep enough for the rest of the month.
  if (monthEnd && c.left > 0 && !promptDone) {
    const keep = keepForRest(c), saveAmt = Math.round((c.left - keep) * 100) / 100;
    if (saveAmt > 0) {
      html += `<section class="card prompt" aria-label="Save what you didn't spend"><h2>Almost month end. Save ${fmt(saveAmt)}?</h2>

  if (c.left >= 0) {
    html += `<div class="amount num">${fmt(c.left)}</div>`;
    html += c.daysLeft > 1 ? `<div class="perday">Daily guide: about <strong class="num">${fmt0(c.perDay)}</strong> a day for ${c.daysLeft} days</div>`
                           : `<div class="perday">last day of the month</div>`;

  } else {
    const next = MONTHS[S.month % 12], b = c.biggest, fresh = c.money - c.bills - c.saveup - c.savings;
    const why = b ? `One big bill: ${esc(b.note)}, ${fmt(b.amt)}.${c.left + b.amt > 0 ? ` Without it, you'd have had ${fmt(c.left + b.amt)} left.` : ""}` : "Spending went past your limits.";
    const tip = b ? `<div class="step"><b>Next time</b><span>Costs like this can come back. <span class="btn-row" style="margin-top:6px"><button class="btn inline" data-saveup="${esc(GROUPS[b.note] || "Other")}">Set aside ${fmt0(Math.ceil(b.amt / 12))} a month for it</button><button class="btn secondary inline" id="was-oneoff">It was a one-off</button></span></span></div>` : "";
    if (c.daysLeft <= 1) {
      // Last day: lead with the fresh start, show the overspend smaller (round 2: the big red number hid everything else).

      const shortWhy = b ? `A ${fmt0(b.amt)} ${esc(b.note.replace(/^.*?:\s*/, ""))}.${c.left + b.amt > 0 ? ` Without it, you'd have ${fmt0(c.left + b.amt)} left.` : ""}` : "Spending went past your limits.";
      html += `<div class="neg" style="font-weight:700">${MONTHS[S.month - 1]} went ${fmt(-c.left)} over</div>
        <div class="amount num">${fmt(fresh)}</div>
        <div class="perday"><strong>to spend in ${next}.</strong> A fresh start tomorrow.</div>
        <div class="over-box"><span><b>Why?</b> ${shortWhy}</span>

  }
  html += `<button type="button" class="btn link howto small" id="howto">New here? How this screen works</button></section>`;

  // Still to do
  const ck = state.checklist, dueBill = PLAN.saveups.find(s => s.due === S.month);
  const items = [
    ["salary", "Salary arrived", ""],

  if (dueBill) items.push(["due", `Pay ${dueBill.name} ${fmt(dueBill.yearly)} from your yearly bills account`, "Due this month. It's already set aside, so it doesn't change Left to spend."]);
  const doneN = items.filter(i => ck[i[0]]).length;
  if (doneN < items.length) {
    html += `<section class="card" aria-label="Still to do this month"><div class="card-head"><h2>Still to do this month</h2><span class="muted">${doneN} of ${items.length} done</span></div>

  } else {
    html += `<section class="card flat" aria-label="Still to do this month"><div class="card-head"><h2>All done this month ✓</h2><span class="muted">${items.length} of ${items.length}</span></div></section>`;
  }

  // Spending limits
  html += `<section class="card" aria-label="Spending limits"><h2>Spending limits</h2>`;
  Object.entries(PLAN.limits).forEach(([cat, lim]) => {
    const sp = c.byCat[cat] || 0, pct = Math.min(100, sp / lim * 100), over = sp > lim, warn = !over && sp >= lim * 0.8;
    html += `<div class="limit"><div class="line"><strong>${cat}</strong><span>${fmt(sp)} of ${fmt0(lim)}</span></div>
      <div class="meter ${over ? "over" : warn ? "warn" : ""}" role="meter" aria-valuemin="0" aria-valuemax="${lim}" aria-valuenow="${Math.round(sp)}" aria-label="${cat} spent"><i style="width:${pct}%"></i></div>
      <div class="line small"><span class="muted"></span><span class="${over ? "neg" : ""}">${over ? fmt(sp - lim) + " over" : fmt(lim - sp) + " left"}</span></div>`;
    if (PLAN.countLimit.cat === cat) {
      const n = weekCount(), lim2 = PLAN.countLimit.perWeek;
      html += `<div class="count">Nice meals over $${PLAN.countLimit.over} <strong>this week</strong>: <strong>${n} of ${lim2}</strong> used${n < lim2 ? ` · ${lim2 - n} left this week` : n === lim2 ? " · none left this week" : " · over"}</div>`;
    }
    html += `</div>`;
  });
  PLAN.noLimit.forEach(cat => { if (c.byCat[cat]) html += `<div class="limit"><div class="line"><strong>${cat}</strong><span>${fmt(c.byCat[cat])} · no limit</span></div></div>`; });
  html += `</section>`;

  // Folded cards: tap to open
  // Yearly bills
  const potTotal = sum(Object.values(state.pots));
  const pots = PLAN.saveups.map(s => { const pot = state.pots[s.name]; const paid = s.due < S.month || (s.due === S.month && state.checklist.due);
    const monthsTo = ((s.due - S.month + 12) % 12) || (paid ? 12 : 0);
    const ok = paid || pot + s.amt * monthsTo >= s.yearly;
    return { s, pot, paid, ok, status: paid ? "paid" : pot >= s.yearly ? "ready" : ok ? "on track" : "short" }; });
  const shortN = pots.filter(p => !p.ok).length;
  html += fold("bills", "Yearly bills", shortN ? `<span class="tag plain">${shortN} short</span>` : `<span class="tag good">All covered</span>`,
    `<p class="explain">Bills that come once a year. You set aside ${fmt(c.saveup)} a month so they're paid for when they're due.</p>
    <div class="rows">${pots.map(p => `<div class="row"><span><strong>${p.s.name}</strong><br><span class="muted small">${fmt0(p.s.yearly)} a year · ${p.paid ? "paid in " + MON3[p.s.due - 1] + ", refilling" : "due " + MONTHS[p.s.due - 1]}</span></span><span class="r">${fmt0(p.pot)} set aside</span><span class="r"><span class="tag ${p.ok ? "good" : "plain"}">${p.status}</span></span></div>`).join("")}</div>
    <div class="line"><span>Total set aside</span><strong class="num">${fmt(potTotal)}</strong></div>
    <p class="muted">Does your yearly bills account show ${fmt(potTotal)}?</p><div class="btn-row"><button class="btn inline" id="pots-yes">Yes</button><button class="btn secondary inline" id="pots-no">No</button></div>`);

  // Saved this year
  const planSoFar = PLAN.savings[0].amt * (S.month - 1) + c.planMoved;
  html += fold("saved", "Saved this year", `<strong class="num">${fmt(c.putAsideYear)}</strong>`,
    `<div class="line"><span>Savings plan (${fmt0(PLAN.savings[0].amt)} a month)</span><span>${fmt(planSoFar)}</span></div>
    <div class="line"><span>Extra you saved</span><span>${fmt(c.putAsideYear - planSoFar)}</span></div>
    ${c.planToMove ? `<div class="line"><span>Still to move this month</span><span>${fmt(c.planToMove)}</span></div>` : ""}
    <p class="explain">Money in your savings account. Money you don't spend stays in your everyday account until you save it (near month end the app asks).</p>`);

  // Big one-offs
  const oo = oneOffsThisYear();
  let ooRows = "";
  Object.entries(oo.groups).sort((a, b) => b[1].amt - a[1].amt).forEach(([g, v]) => {
    ooRows += `<div class="row"><span><strong>${esc(g)}</strong><br><span class="muted small">${v.items.map(i => esc(i.note) + " (" + MON3[i.month - 1] + ")").join(", ")}</span></span><span class="r">${v.n} item${v.n > 1 ? "s" : ""}</span><span class="r">${fmt(v.amt)}</span></div>`;
    if (v.n >= 2) ooRows += `<div class="row"><span class="muted small">Came back ${v.n} times. Save up about ${fmt0(v.amt / 12)} a month for this?</span><span></span><span class="r"><button class="btn inline" data-saveup="${esc(g)}">Save up</button></span></div>`;
  });
  html += fold("oneoffs", "Big one-offs this year", `<strong class="num">${fmt(oo.total)}</strong>`,
    `<p class="explain">Single expenses of ${fmt0(PLAN.oneOffAt)} or more. They don't come every month, but they add up.</p><div class="rows">${ooRows}</div>`);

  // Things you buy often
  const rb = repeatBuys(), ups = rb.filter(x => x.trend === "up").length;
  html += fold("often", "Things you buy often", ups ? `<span class="tag plain">${ups} up</span>` : `<span class="tag good">steady</span>`,
    `<div class="rows"><div class="row head"><span></span><span class="r">This month</span><span class="r">Usual by now</span></div>
    ${rb.map(x => `<div class="row"><span><strong>${x.name}</strong> ${x.trend === "down" ? '<span class="tag good">▼ nice</span>' : x.trend === "up" ? '<span class="tag plain">▲ more</span>' : ""}</span><span class="r">${x.n} · ${fmt0(x.amt)}</span><span class="r muted">${Math.round(x.un)} · ${fmt0(x.ua)}</span></div>`).join("")}
    </div><p class="muted small">From the notes you type. You decide what's worth cutting.</p>`);

  app.innerHTML = html;
  bindCommon();
  const q = id => document.getElementById(id);
  q("info").onclick = () => { openWorkings = !openWorkings; render(); };
  q("howto").onclick = howtoSheet;
  document.querySelectorAll("details[data-fold]").forEach(d => d.ontoggle = () => { d.open ? openFolds.add(d.dataset.fold) : openFolds.delete(d.dataset.fold); });
  document.querySelectorAll("[data-check]").forEach(el => {
    const toggle = () => { const k = el.dataset.check; state.checklist[k] = !state.checklist[k]; render(); if (state.checklist[k]) toast(k === "bills" ? `Ticked. ${fmt(calc().saveup)} is in your yearly bills account.` : k === "savings" ? `Ticked. Saved this year: ${fmt(calc().putAsideYear)}.` : "Ticked."); };
    el.onclick = toggle; el.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } };
  });
  if (q("save-all")) {
    q("save-all").onclick = () => saveAmount(parseFloat(q("save-all").dataset.amt));
    q("save-some").onclick = () => sheetSaveSome();
    q("save-not").onclick = () => { promptDone = true; render(); toast("OK. The money stays in your everyday account."); };
  }
  document.querySelectorAll("[data-saveup]").forEach(b => b.onclick = () => toast(`Prototype: this would add "${b.dataset.saveup}" to your yearly bills.`));
  if (q("was-oneoff")) q("was-oneoff").onclick = () => toast("OK. It stays in Big one-offs this year; nothing else changes.");
  if (q("pots-yes")) q("pots-yes").onclick = () => toast("Good. Your yearly bills account matches.");
  if (q("pots-no")) q("pots-no").onclick = () => toast("Prototype: this would let you type the real balance and fix it.");
}
function howtoSheet() {

function saveAmount(a) {
  a = Math.round(a * 100) / 100; if (!(a > 0)) return;
  state.entries.push({ id: "s" + Date.now(), day: S.day, cat: null, amt: a, note: "Moved to savings", kind: "saved" });
  promptDone = true; lastSaved = { amt: a }; render(); window.scrollTo(0, 0);
  document.querySelector('[aria-label="Saved"]')?.classList.add("glow");
}
/* What to keep for the rest of the month: your usual daily spending so far, rounded up to $10. */
function keepForRest(c) { return Math.min(c.left, Math.ceil(c.spent / S.day * c.daysLeft / 10) * 10); }

function renderLog() {

    <button class="btn" id="add">Add</button></section>`;

    const e = { id: "e" + Date.now(), day, cat, amt: Math.round(a * 100) / 100, note: note || cat, kind: "expense", oneOff: a >= PLAN.oneOffAt };
    state.entries.push(e); if (e.oneOff) GROUPS[e.note] = GROUPS[e.note] || "Other";

    const msg = `Added ${fmt(e.amt)} · ${cat}. Left to spend: ${fmt(after.left)}.` + (lim && sp > lim ? ` ${cat} is ${fmt(sp - lim)} over its limit.` : "");
    if (e.oneOff) sheetOneOff(e, msg); else toast(msg);
  };
}

function renderHistory() {
  const es = state.entries.slice().sort((a, b) => b.day - a.day || b.id.localeCompare(a.id)).slice(0, 40);
  app.innerHTML = header() + `<div class="monthbar"><h1>History</h1><span class="muted">${MONTHS[S.month - 1]}</span></div>
    <section class="card"><div class="rows">${es.map(e => `<div class="row"><span>${esc(e.note)}<br><span class="muted small">${e.day} ${MON3[S.month - 1]} · ${e.kind === "saved" ? "Saved" : esc(e.cat)}${e.oneOff ? " · one-off" : ""}</span></span><span class="r"><button class="btn link" data-edit="${e.id}">Edit</button></span><span class="r">${fmt(e.amt)}</span></div>`).join("")}</div>
    <p class="muted small">Showing the latest 40. Every month stays editable.</p></section>`;
  bindCommon();
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const e = state.entries.find(x => x.id === b.dataset.edit);
    openSheet(`<h2>${esc(e.note)}</h2><p class="num">${fmt(e.amt)} · ${e.day} ${MON3[S.month - 1]}</p>
      ${e.kind === "expense" ? `<button class="btn secondary" id="mark">${e.oneOff ? "Not a one-off" : "This was a one-off"}</button>` : ""}
      <button class="btn" id="close">Done</button>`);
    const m = document.getElementById("mark");
    if (m) m.onclick = () => { e.oneOff = !e.oneOff; if (e.oneOff) GROUPS[e.note] = GROUPS[e.note] || "Other"; closeSheet(); renderHistory(); toast(e.oneOff ? "Marked as a one-off. It's on Big one-offs this year." : "No longer a one-off."); };
    document.getElementById("close").onclick = closeSheet;
  });
}

/* Setup step: yearly bills, prompted by category */
const PROMPTS = [
  ["Insurance premiums", "Life, health, home, car: paid once a year"], ["Property tax", "IRAS, usually due in January"],
  ["Income tax", "IRAS, if you pay it in one go"], ["Road tax, car servicing", "If you have a car or motorbike"],
  ["Festive gifts", "CNY ang bao, Hari Raya, Deepavali, Christmas"], ["Birthdays and weddings", "Gifts, red packets, parties"],
  ["Travel", "Flights and holidays you take most years"], ["Home upkeep and repairs", "Aircon servicing, repairs, furniture"],
  ["Yearly renewals", "Subscriptions, memberships, licences paid yearly"], ["School or course fees", "For you or your children"],
];
let setup = {};
function renderSetup() {
  const monthly = sum(Object.values(setup).filter(x => x.on).map(x => (parseFloat(x.amt) || 0) * (12 / x.every) / 12));
  app.innerHTML = header() + `<div class="monthbar"><h1>Setup</h1><span class="muted">Step 4 of 7</span></div>
  <section class="card"><h2>Bills that don't come every month</h2>
    <p class="muted">These catch people off guard. Tap any you pay. We'll set aside a little each month so they're ready when they're due.</p>
    <div>${PROMPTS.map(([t, ex], i) => { const s = setup[i] || {}; return `<div class="prompt-item"><button aria-expanded="${!!s.on}" data-p="${i}"><span>${t}<span class="ex">${ex}</span></span><span class="box" aria-hidden="true" style="${s.on ? "background:var(--accent);border-color:var(--accent)" : ""}">${s.on ? "✓" : ""}</span></button>
      ${s.on ? `<div class="grid2"><label for="pa${i}">Amount each time<input id="pa${i}" type="text" inputmode="decimal" value="${s.amt || ""}" placeholder="$"></label>
      <label for="pe${i}">How often<select id="pe${i}"><option value="12"${s.every == 12 ? " selected" : ""}>Once a year</option><option value="6"${s.every == 6 ? " selected" : ""}>Every 6 months</option><option value="3"${s.every == 3 ? " selected" : ""}>Every 3 months</option></select></label>
      <label for="pd${i}">Next due<select id="pd${i}">${MONTHS.map((m, k) => `<option${s.due == k ? " selected" : ""} value="${k}">${m}</option>`).join("")}</select></label>
      <label for="ps${i}">Already saved<input id="ps${i}" type="text" inputmode="decimal" value="${s.saved || ""}" placeholder="$0"></label></div>` : ""}</div>`; }).join("")}</div>
    <div class="line"><strong>Set aside each month</strong><strong class="num">${fmt(monthly)}</strong></div>
    <button class="btn" id="setup-next">Next</button></section>`;
  bindCommon();
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { const i = b.dataset.p; setup[i] = setup[i] || { amt: "", every: 12, due: 0, saved: "" }; setup[i].on = !setup[i].on; renderSetup(); });
  Object.keys(setup).forEach(i => { if (!setup[i].on) return;
    [["pa", "amt"], ["pe", "every"], ["pd", "due"], ["ps", "saved"]].forEach(([p, k]) => { const el = document.getElementById(p + i); if (el) el.onchange = () => { setup[i][k] = el.value; renderSetup(); }; }); });
  document.getElementById("setup-next").onclick = () => toast(`${Object.values(setup).filter(x => x.on).length} bills added. The prototype's setup ends here.`);
}

/* ── Shell: tabs, scenario picker, sheets, toast ─────────────────────── */
function bindCommon() { document.getElementById("demo-chip").onclick = scenarioSheet; }
function render() {
  const isSetup = state.key === "setup";
  document.getElementById("tabbar").hidden = isSetup;
  document.querySelectorAll(".tab").forEach(t => t.dataset.tab === tab ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
  if (isSetup) return renderSetup();
  ({ month: renderMonth, log: renderLog, budget: renderBudget, history: renderHistory })[tab]();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { tab = t.dataset.tab; render(); window.scrollTo(0, 0); });
function scenarioSheet() {
  openSheet(`<h2>Demo · made-up numbers</h2><p class="muted">This is a prototype of How to Get Rich. The person and every number are made up. Pick the day the form asks for:</p>
    <div class="btn-row" style="flex-direction:column;align-items:stretch">${Object.entries(SCENARIOS).map(([k, v]) => `<button class="btn ${k === state.key ? "" : "secondary"}" data-sc="${k}">${v.label}</button>`).join("")}
    <button class="btn ${state.key === "setup" ? "" : "secondary"}" data-sc="setup">Setup: yearly bills</button></div>
    <button class="btn link" id="sc-close">Close</button>`);
  document.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => { closeSheet(); go(b.dataset.sc); });
  document.getElementById("sc-close").onclick = closeSheet;
}
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  const layer = document.getElementById("layer");
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById("scrim").onclick = e => { if (e.target.id === "scrim") closeSheet(); };
  layer.querySelector(".sheet button, .sheet input")?.focus();
}
function closeSheet() { document.getElementById("layer").innerHTML = ""; lastFocus?.focus?.(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast"); document.getElementById("toast-text").textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, Math.max(5000, Math.min(15000, msg.split(" ").length / 2.5 * 1000)));
}
document.getElementById("toast-close").onclick = () => document.getElementById("toast").hidden = true;

function go(key) {
  if (key === "setup") { state = { key: "setup" }; setup = {}; S = SCENARIOS["mid-march"]; }
  else load(key);
  tab = "month"; if (location.hash !== "#" + key) history.replaceState(null, "", "#" + key);
  render(); window.scrollTo(0, 0);
}
function fromHash() { const k = location.hash.slice(1); go(SCENARIOS[k] || k === "setup" ? k : "mid-march"); }
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
